<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="latexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="480" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="140" fill="#f43f5e" opacity="0.15" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- Wrist Base -->
    <path d="M 140 430 L 260 430 L 268 350 L 132 350 Z" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    
    <!-- Wrist Strap / Cuff Bandage -->
    <rect x="125" y="380" width="150" height="42" rx="8" fill="url(#primaryGrad)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="200" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SPIRE</text>

    <!-- Palm & Hand Silhouette -->
    <!-- Pinky Finger -->
    <path d="M 125 240 C 115 220, 110 180, 118 160 C 124 145, 142 148, 146 165 L 152 230 Z" fill="url(#primaryGrad)"/>
    <!-- Ring Finger -->
    <path d="M 152 230 C 148 180, 148 120, 160 100 C 168 85, 186 88, 190 108 L 194 220 Z" fill="url(#primaryGrad)"/>
    <!-- Middle Finger -->
    <path d="M 194 220 C 194 160, 196 90, 208 70 C 218 55, 238 58, 242 78 L 244 220 Z" fill="url(#primaryGrad)"/>
    <!-- Index Finger -->
    <path d="M 244 220 C 248 170, 256 110, 268 95 C 278 82, 296 88, 296 110 L 286 240 Z" fill="url(#primaryGrad)"/>
    <!-- Thumb Finger -->
    <path d="M 286 270 C 315 260, 345 240, 350 255 C 355 270, 335 305, 305 320 L 275 325 Z" fill="url(#primaryGrad)"/>

    <!-- Central Palm Core -->
    <path d="M 125 240 C 118 290, 132 350, 132 350 L 268 350 C 278 335, 305 320, 275 240 Z" fill="url(#primaryGrad)"/>
    <path d="M 135 250 C 128 300, 140 340, 140 340 L 260 340 C 265 315, 290 280, 260 245 Z" fill="url(#latexGrad)"/>

    <!-- Punching Zone Elements -->
    <g opacity="0.85">
      <circle cx="170" cy="190" r="10" fill="#fb7185" opacity="0.6"/>
      <circle cx="200" cy="180" r="13" fill="#fb7185" opacity="0.8"/>
      <circle cx="230" cy="185" r="11" fill="#fb7185" opacity="0.7"/>
      <circle cx="260" cy="205" r="9" fill="#fb7185" opacity="0.6"/>
      
      <circle cx="185" cy="215" r="8" fill="#f43f5e" opacity="0.9"/>
      <circle cx="215" cy="210" r="10" fill="#f43f5e" opacity="0.9"/>
      <circle cx="245" cy="225" r="8" fill="#f43f5e" opacity="0.9"/>

      <line x1="132" y1="170" x2="140" y2="230" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="174" y1="110" x2="178" y2="200" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="225" y1="85" x2="225" y2="190" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="280" y1="115" x2="270" y2="210" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
      <line x1="330" y1="265" x2="290" y2="295" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <path d="M 152 230 Q 170 260 200 270 Q 235 260 244 220" fill="none" stroke="#000000" stroke-width="3" opacity="0.4"/>
    <path d="M 200 270 L 200 345" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.3"/>

    <rect x="165" y="295" width="70" height="20" rx="4" fill="#000000" opacity="0.4"/>
    <text x="200" y="309" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#fb7185" text-anchor="middle" letter-spacing="1">PRO LATEX 4mm</text>
  </g>

  <g transform="translate(20, 24)">
    <rect width="130" height="24" rx="12" fill="#f43f5e" opacity="0.2"/>
    <rect width="130" height="24" rx="12" fill="none" stroke="#f43f5e" stroke-width="1"/>
    <text x="65" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="1">SPIRE</text>
  </g>

  <text x="380" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="end">STRIKE FORCE FS</text>
</svg>